<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Glance mark: the two bar groups meeting at the glowing spine, as in the addon -->
  <defs>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6"/><stop offset=".35" stop-color="#ffc71a"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc71a"/><stop offset="1" stop-color="#ff4033"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d640"/><stop offset=".5" stop-color="#d1c22a"/><stop offset=".5" stop-color="#a99d1c"/><stop offset="1" stop-color="#b8aa20"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02a22"/><stop offset=".5" stop-color="#c41c16"/><stop offset=".5" stop-color="#8f120e"/><stop offset="1" stop-color="#a3150f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#121214"/>
  <!-- left group: the player -->
  <rect x="56" y="196" width="168" height="62" fill="#000" stroke="#000" stroke-width="6"/>
  <rect x="56" y="196" width="168" height="62" fill="url(#gold)"/>
  <rect x="56" y="264" width="168" height="26" fill="#d4cc1a"/>
  <!-- right group: the target, with elite brackets -->
  <rect x="288" y="196" width="168" height="62" fill="#2a1414"/>
  <rect x="288" y="196" width="104" height="62" fill="url(#blood)"/>
  <rect x="288" y="264" width="168" height="26" fill="#3a0a0a"/>
  <rect x="288" y="264" width="60" height="26" fill="#d81e18"/>
  <path d="M276 184 h22 M276 184 v22 M468 184 h-22 M468 184 v22 M276 302 h22 M276 302 v-22 M468 302 h-22 M468 302 v-22" stroke="#ffc71a" stroke-width="8" fill="none"/>
  <!-- the spine and its spark -->
  <rect x="247" y="150" width="18" height="230" fill="url(#spine)"/>
  <circle cx="256" cy="150" r="58" fill="url(#spark)"/>
  <circle cx="256" cy="150" r="13" fill="#fffbe8"/>
</svg>
