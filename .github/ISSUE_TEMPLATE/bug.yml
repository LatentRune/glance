name: Bug
description: Something in Glance is wrong, missing or throws a Lua error.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When it happens
      description: What you were doing. Every time, or only sometimes?
  - type: input
    id: client
    attributes:
      label: Client, class and level
      placeholder: Classic Era 1.15.x, hunter 32
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glance version
      description: Shown in the AddOns list.
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: Turn errors on with `/console scriptErrors 1` (or use BugSack) and paste it here.
      render: text
  - type: textarea
    id: shot
    attributes:
      label: Screenshot
      description: Drag one in. `/glance help` on helps us see which part you mean.
